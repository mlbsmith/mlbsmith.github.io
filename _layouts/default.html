<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (error) {}
      }());
    </script>
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <div class="header-controls">
            <nav>
              <a href="{{ site.baseurl }}/writing/" {% if page.url == '/writing/' or page.layout == 'post' %}class="active"{% endif %}>Writing</a>
              <a href="{{ site.baseurl }}/projects/" {% if page.url == '/projects/' %}class="active"{% endif %}>Projects</a>
              <a href="{{ site.baseurl }}/reading/" {% if page.url == '/reading/' or page.url contains '/reading/' %}class="active"{% endif %}>Reading</a>
              <a href="{{ site.baseurl }}/now/" {% if page.url == '/now/' %}class="active"{% endif %}>Now</a>
            </nav>

            <button class="theme-toggle" type="button" aria-label="Switch to light mode">
              <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
              <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
            </button>
          </div>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
    {% include external-links.html %}
    <script>
      (function () {
        var toggle = document.querySelector('.theme-toggle');

        function isLight() {
          return document.documentElement.getAttribute('data-theme') === 'light';
        }

        function updateToggle() {
          var light = isLight();
          toggle.setAttribute('aria-label', 'Switch to ' + (light ? 'dark' : 'light') + ' mode');
          toggle.setAttribute('aria-pressed', light ? 'true' : 'false');
        }

        toggle.addEventListener('click', function () {
          var nextTheme = isLight() ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', nextTheme);

          try {
            localStorage.setItem('theme', nextTheme);
          } catch (error) {}

          updateToggle();
        });

        updateToggle();
      }());
    </script>
  </body>
</html>
